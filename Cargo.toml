[workspace]
resolver = "2"
members = [
    "crates/kinetic-core",
    "crates/kinetic-format",
    "crates/kinetic-compat",
    "crates/kinetic-bench",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Kinetic Engineering Team"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
crc32fast = "1.4"
sysinfo = "0.30"
walkdir = "2.5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
sevenz-rust = "0.6"
tempfile = "3.10"
crossbeam-channel = "0.5"
lz4_flex = "0.11"
flate2 = "1.0"
brotli = "9.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
blake3 = "1.5"
aes-gcm = "0.10"
argon2 = "0.5"